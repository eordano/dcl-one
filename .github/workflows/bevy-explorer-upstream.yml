name: Bevy Explorer / Dependency drift
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: bevy-explorer-dependency-drift
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails when a pinned commit is not on the ref its source names, or a source cannot be checked.
      - name: Check each pinned source against its upstream
        shell: bash
        run: python3 tooling/upstream-drift.py check | tee -a "$GITHUB_STEP_SUMMARY"
      # Each build job proves the tree ids when it rebuilds the trees. This run proves them with no build.
      - name: Prove each patch series against its upstream commit and tree ids
        if: ${{ !cancelled() }}
        uses: ./.github/actions/bevy-explorer-sources
        with:
          verify: true
      - name: Prove the in-tree crates against their public repositories
        if: ${{ !cancelled() }}
        run: python3 tooling/vendor-provenance.py
      - name: Build the dependency drift site
        if: ${{ !cancelled() }}
        run: |
          python3 tooling/upstream-drift.py collect
          python3 tooling/upstream-drift-site.py
      - name: Upload the drift site
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bevy-explorer-dependency-drift-site
          path: rendering/bevy-explorer/drift/
          retention-days: 30
